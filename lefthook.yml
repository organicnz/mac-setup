# Lefthook configuration for mac-setup
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  
  commands:
    # Format check
    cargo-fmt:
      glob: "**/*.rs"
      run: cargo fmt --check

    # Lint
    cargo-clippy:
      glob: "**/*.rs"
      run: cargo clippy -- -D warnings
    
    # Validate plist template
    plist-check:
      glob: "config/*.plist.template"
      run: cargo run -q -- audit plist {staged_files}
    
    # Check for secrets/tokens
    secrets-check:
      glob: "*"
      run: cargo run -q -- audit secrets {staged_files}
    
    # Markdown linting
    markdown-lint:
      glob: "*.md"
      run: cargo run -q -- audit markdown {staged_files}

pre-push:
  commands:
    test:
      run: cargo test
