[package]
name = "mac-setup"
version = "0.3.0"
edition = "2021"
description = "Unified macOS package management: one-time provisioning + automated updates"
repository = "https://github.com/organicnz/mac-setup"
license = "MIT"

[[bin]]
name = "mac-setup"
path = "src/bin/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "0.8"
users = "0.11"
wait-timeout = "0.2"
