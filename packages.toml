# Language runtimes and versioned tools — managed exclusively by mise
[mise]
tools = [
  "node@lts",
  "python@3.12",
  "python@3.13",
  "go@latest",
  "deno@latest",
  "ruby@latest",
  "java@temurin-21",
  "aqua:hashicorp/terraform@latest",
  "aqua:hashicorp/packer@latest",
  "aqua:getsentry/sentry-cli@latest",
  "aqua:pulumi/pulumi@latest",
]

# azure-cli managed via pipx (not in aqua registry)
# install manually: python3 -m pipx install azure-cli

[pip]
packages = [
  "python-dotenv",
  "shodan",
  "mmh3",
]

# Isolated Python apps — installed via pipx into their own virtualenvs
[pipx]
packages = [
  "azure-cli",
]

[npm]
global = [
  "imgproxy",
]

[go]
packages = [
  "github.com/tomnomnom/httprobe@master",
]
